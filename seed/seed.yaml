# Seed data shape for the thousand-emails project.
# Everything here is an aggregate. Change a number, re-run `python generate.py`, get a new world.
# Lines marked ASSUMED were not specified and are placeholders to correct.

seed: 20260912
out_dir: fixtures
as_of: "2026-09-12"          # "today" for the generated world
history_months: 8            # how far back 2026 activity goes (Jan..Aug)

accounts:
  total: 5000
  type_mix: { prospect: 4000, customer: 500, churned: 500 }
  # ordered smallest to largest
  bands: ["1-50", "51-200", "201-1000", "1001-5000", "5000+"]
  band_share: { "1-50": 0.08, "51-200": 0.30, "201-1000": 0.32, "1001-5000": 0.18, "5000+": 0.12 }
  contacts_per_band: { "1-50": 1, "51-200": 3, "201-1000": 5, "1001-5000": 7, "5000+": 11 }
  industry_share:
    Technology: 0.50
    Financial Services: 0.10
    Manufacturing: 0.08
    CPG: 0.07
    Hospitality: 0.06
    Healthcare: 0.06
    Retail: 0.05
    Professional Services: 0.05
    Media: 0.03
  region_share: { US: 0.78, UK: 0.08, Canada: 0.06, EU: 0.05, APAC: 0.03 }   # ASSUMED

customers:
  tenure_years: [3, 4]            # uniform range for still-active customers
  annual_churn_hazard: 0.25       # used to place churn dates for the 500 churned accounts
  churn_reasons: { budget: 0.35, champion_left: 0.25, consolidated_tools: 0.2, low_usage: 0.2 }   # ASSUMED
  arr_by_band: { "1-50": 8000, "51-200": 18000, "201-1000": 45000, "1001-5000": 110000, "5000+": 240000 }  # ASSUMED

# Who takes the meeting, by size band. These are the HIDDEN lift values the scoring
# pipeline must recover from generated history. They also drive title sampling.
# personas: HR (HR/People generalists), TRC (Total Rewards / Compensation), TAL (Talent), FIN (Finance), OTHER
persona_meeting_share:
  "1-50":      { HR: 0.80, TRC: 0.05, TAL: 0.05, FIN: 0.08, OTHER: 0.02 }
  "51-200":    { HR: 0.70, TRC: 0.12, TAL: 0.08, FIN: 0.08, OTHER: 0.02 }
  "201-1000":  { HR: 0.42, TRC: 0.38, TAL: 0.08, FIN: 0.08, OTHER: 0.04 }
  "1001-5000": { HR: 0.22, TRC: 0.62, TAL: 0.06, FIN: 0.06, OTHER: 0.04 }
  "5000+":     { HR: 0.12, TRC: 0.78, TAL: 0.04, FIN: 0.03, OTHER: 0.03 }
# Share of contacts (who exists at the company) by persona, by band. ASSUMED.
persona_contact_share:
  "1-50":      { HR: 0.55, TRC: 0.02, TAL: 0.08, FIN: 0.20, OTHER: 0.15 }
  "51-200":    { HR: 0.42, TRC: 0.08, TAL: 0.15, FIN: 0.18, OTHER: 0.17 }
  "201-1000":  { HR: 0.33, TRC: 0.22, TAL: 0.15, FIN: 0.15, OTHER: 0.15 }
  "1001-5000": { HR: 0.28, TRC: 0.32, TAL: 0.15, FIN: 0.12, OTHER: 0.13 }
  "5000+":     { HR: 0.25, TRC: 0.40, TAL: 0.15, FIN: 0.10, OTHER: 0.10 }
seniority_share: { C: 0.06, VP: 0.14, Director: 0.28, Manager: 0.30, IC: 0.22 }   # ASSUMED
seniority_meeting_lift: { C: 0.7, VP: 1.3, Director: 1.4, Manager: 1.0, IC: 0.5 }  # ASSUMED

contacts:
  email_status_share: { verified: 0.72, catch_all: 0.13, unverified: 0.08, none: 0.07 }   # ASSUMED
  phone_type_share: { mobile: 0.28, direct: 0.22, hq: 0.30, none: 0.20 }                 # ASSUMED
  still_at_company_true: 0.93        # ASSUMED; the false tail is people who left
  opted_out: 0.03                    # ASSUMED
  do_not_call: 0.02                  # ASSUMED
  past_customer_share: 0.03          # contacts with a prior job at a customer/churned account during its subscription
  linkedin_active_share: 0.35        # ASSUMED

team:
  sdrs: ["sdr_1", "sdr_2"]
  patch_size: 2000
  patch_weeks: 2
  assignment: snake_draft_by_account_score
  monthly_sequenced_per_rep: 4000    # implied by 2,000 biweekly

history:                              # 2026 Jan..Aug activity to learn scoring from
  touched_share_of_contacts: 0.30     # ASSUMED: share of contacts sequenced at least once in 2026
  reply_rate: 0.015
  positive_reply_share: 0.35          # ASSUMED share of replies that are positive
  meeting_rate_baseline: 0.004        # per touched contact, before persona/seniority lift
  nb_opps_target: 260                 # ASSUMED; rough count of 2026 NB opps the generator aims for
  sequences: [ "2wk-email-call-li", "2wk-email-call", "2wk-email-only" ]

cooldowns: { no_response_days: 60, negative_days: 180, unsubscribe: permanent }

exclusions:                           # RevOps rules as the plan assumes them; ASSUMED until the real file arrives
  customer_accounts: true
  open_opportunity: true
  ae_owned: true
  touched_last_n_days: 60
  bounced: true
  unsubscribed: true
  do_not_contact: true
  competitors_partners: true

gong:
  calls_per_month: 400
  months_of_transcripts: 3            # transcripts are large; metadata covers history_months, transcripts only the last N
  call_types: { intro: 0.55, demo: 0.30, cold_call: 0.15 }   # ASSUMED split; intro=30m, demo=60m
  duration_minutes: { intro: 30, demo: 60, cold_call: 4 }
  pain_families:
    benchmarking: [ "no_reliable_market_data", "stale_survey_data", "geo_differentials", "startup_equity_benchmarks" ]
    planning: [ "budget_uncertainty", "headcount_planning", "merit_cycle_modeling", "range_design" ]
    repricing: [ "salary_reprices", "retention_adjustments", "pay_compression", "promotion_bands" ]
    communicating: [ "pay_transparency_law", "manager_enablement", "employee_questions", "offer_explanations" ]
  objections: [ "budget", "timing", "have_a_survey_vendor", "too_small", "using_spreadsheets", "need_finance_buyin" ]
  competitors: [ "Radford", "Mercer", "Carta Total Comp", "Levels.fyi", "OpenComp", "Assemble" ]

bigquery:                             # free market-data product + Pave Data Lab
  users_band_share: { "1-50": 0.42, "51-200": 0.36, "201-1000": 0.14, "1001-5000": 0.05, "5000+": 0.03 }
  accounts_with_usage_share: 0.18     # ASSUMED: share of accounts (any type) with at least one free user
  users_per_account: [1, 3]
  searches_per_user: [2, 40]
  locations: [ "US All", "San Francisco Bay Area", "New York City", "Los Angeles", "Seattle", "Austin", "Boston", "Chicago", "Denver", "Remote - US" ]
  valuation_filters: [ "all", "<$50M", "$50M-$250M", "$250M-$1B", "$1B-$5B", ">$5B" ]

org_shape:                            # medians by band; customers define the benchmark, prospects vary around it
  medians:
    "1-50":      { HR_People: 1, TR_Comp: 0, Talent: 0 }
    "51-200":    { HR_People: 2, TR_Comp: 0, Talent: 1 }
    "201-1000":  { HR_People: 3, TR_Comp: 2, Talent: 2 }
    "1001-5000": { HR_People: 4, TR_Comp: 3, Talent: 4 }
    "5000+":     { HR_People: 6, TR_Comp: 5, Talent: 5 }   # HR_People and TR_Comp ASSUMED for 5000+

job_postings:
  accounts_with_open_roles_share: 0.55     # ASSUMED
  open_roles_per_account: [1, 12]
  dataset_relevance_by_industry: { Technology: 0.80, default: 0.50 }
  families_file: pave_job_families.yaml

mess:                                 # injected imperfections, all logged to truth/injected_mess.csv
  duplicate_contacts: 0.012
  title_typos: 0.05
  domain_mismatch: 0.01
  stale_still_at_company: 0.03        # flagged true but the person left
  orphan_contacts: 0.004
  soft_deleted: 0.006
  opted_out_but_in_sequence: 0.002
  account_type_changed_midyear: 0.01
